<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرهنگ و هنر — تکالیف درس فرهنگ و هنر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6ee; --surface:#fffdf7; --surface2:#f3ecdd; --text:#1e2a25; --dim:#6b6f66;
  --accent:#1e3a2f; --accent2:#2c5545; --gold:#c9a86a; --gold-strong:#a8843f;
  --border:#e6dcc6; --shadow:0 10px 30px rgba(30,58,47,.10);
  --hero-shade:linear-gradient(180deg, rgba(250,246,238,.88), rgba(250,246,238,.55) 55%, rgba(250,246,238,.92));
  --hero-img-opacity:.62; --input:#fff; --danger:#b3261e; --ok:#1e6b3a;
}
[data-theme="dark"]{
  --bg:#121614; --surface:#1b201d; --surface2:#222824; --text:#f0ead9; --dim:#a8ad9e;
  --accent:#c9a86a; --accent2:#e0c48a; --gold:#c9a86a; --gold-strong:#e0c48a;
  --border:#333a34; --shadow:0 10px 30px rgba(0,0,0,.45);
  --hero-shade:linear-gradient(180deg, rgba(18,22,20,.90), rgba(18,22,20,.72) 55%, rgba(18,22,20,.94));
  --hero-img-opacity:.55; --input:#232823; --danger:#ff8a80; --ok:#7ddb9a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
a{color:var(--accent2)}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav{max-width:1060px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-size:22px}
.brand{font-weight:800;font-size:18px}
.brand small{display:block;font-size:12px;color:var(--dim);font-weight:400}
.nav nav{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.nav button{background:transparent;border:1px solid transparent;color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px}
.nav button.active{background:var(--gold);color:#1e2a25;font-weight:700}
.theme-btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 12px;cursor:pointer;font-family:inherit;color:var(--text)}
main{max-width:1060px;margin:0 auto;padding:22px 18px 60px}
.hero{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);min-height:340px;display:flex;align-items:flex-end}
.hero-art{position:absolute;inset:0;opacity:var(--hero-img-opacity);background:
 radial-gradient(circle at 78% 22%, #e8b4a0 0 90px, transparent 91px),
 radial-gradient(circle at 62% 55%, #9db8a4 0 110px, transparent 111px),
 radial-gradient(circle at 28% 30%, #d9c07a 0 80px, transparent 81px),
 linear-gradient(135deg,#f3e2c8,#dfe8d8 55%,#e9d5c2)}
.hero-shade{position:absolute;inset:0;background:var(--hero-shade)}
.hero-inner{position:relative;padding:34px;max-width:640px}
.eyebrow{color:var(--gold-strong);font-weight:700;letter-spacing:.5px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.25;margin:6px 0}
.lead{color:var(--dim);font-size:16px}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;font-family:inherit;font-weight:700;font-size:15px}
.btn-primary{background:var(--accent);color:#fff}
[data-theme="dark"] .btn-primary{background:var(--gold);color:#1e2a25}
.btn-gold{background:var(--gold);color:#1e2a25}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:999px;padding:8px 14px;cursor:pointer;font-family:inherit}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid2{grid-template-columns:1fr 1fr}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--input);color:var(--text);font-family:inherit;font-size:15px}
textarea{min-height:90px;resize:vertical}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--surface2);border:1px solid var(--border)}
.badge.gold{background:var(--gold);color:#1e2a25;border-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center}
.stat b{font-size:26px;display:block}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tabs button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 16px;border-radius:999px;cursor:pointer;font-family:inherit}
.tabs button.active{background:var(--accent);color:#fff}
[data-theme="dark"] .tabs button.active{background:var(--gold);color:#1e2a25}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:right;vertical-align:top}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.wall figure{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer}
.wall img{width:100%;height:200px;object-fit:cover;display:block}
.wall figcaption{padding:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.modal-box{background:var(--surface);color:var(--text);border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.annotate-wrap{position:relative;display:inline-block;max-width:100%}
.annotate-wrap img{max-width:100%;border-radius:12px;display:block}
.pin{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1e2a25;border:2px solid #fff;display:grid;place-items:center;font-weight:800;transform:translate(-50%,-50%);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pin-note{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px}
.muted{color:var(--dim);font-size:14px}
.codebox{font-size:28px;letter-spacing:3px;font-weight:800;text-align:center;border:2px dashed var(--gold);border-radius:14px;padding:14px;margin:14px 0}
.hidden{display:none!important}
footer{border-top:1px solid var(--border);padding:22px 18px;text-align:center;color:var(--dim)}
</style>
</head>
<body>
<header><div class="nav">
  <div class="logo">🎨</div>
  <div class="brand"><span id="brandTitle">فرهنگ و هنر</span><small id="brandSub">پایه‌های هفتم، هشتم و نهم</small></div>
  <nav>
    <button data-page="home" class="active">خانه</button>
    <button data-page="submit">ارسال تکلیف</button>
    <button data-page="track">پیگیری</button>
    <button data-page="wall">دیوار آثار زیبا</button>
    <button data-page="teacher">پنل معلم</button>
  </nav>
  <button class="theme-btn" id="themeBtn" type="button">🌙 تاریک</button>
</div></header>
<main id="app"></main>
<footer id="footerText">سایت کلاس فرهنگ و هنر — برای دانش‌آموزان پایه هفتم، هشتم و نهم</footer>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>

<script>
const LS='cultureArtDBv1';
const defaultTexts={siteTitle:'فرهنگ و هنر',siteSub:'پایه‌های هفتم، هشتم و نهم',homeTitle:'تکالیف درس فرهنگ و هنر',homeText:'تکلیف‌های فعال در پایین همین صفحه هستند. برای ارسال، روی دکمه «ارسال تکلیف» بزنید، پایه و کلاس‌تان را انتخاب کنید و عکس یا فایل کارتان را بفرستید. در پایان یک کد پیگیری می‌گیرید؛ آن را نگه دارید.',wallTitle:'دیوار آثار زیبا',wallText:'آثار منتخب دانش‌آموزان که معلم برای نمایش انتخاب کرده است.',submitTitle:'ارسال تکلیف',trackTitle:'پیگیری تکلیف',footerText:'سایت کلاس فرهنگ و هنر — برای دانش‌آموزان پایه هفتم، هشتم و نهم'};
let db=null;
function load(){try{db=JSON.parse(localStorage.getItem(LS))}catch(e){db=null}
 if(!db||!db.texts){db={assignments:[],submissions:[],texts:{...defaultTexts},teacherPass:null}; save();}}
function save(){localStorage.setItem(LS,JSON.stringify(db))}
function faDate(iso){if(!iso)return '—';try{return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'long',day:'numeric'}).format(new Date(iso+'T12:00:00'))}catch(e){return iso}}
function uid(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTexts(){document.getElementById('brandTitle').textContent=db.texts.siteTitle;document.getElementById('brandSub').textContent=db.texts.siteSub;document.getElementById('footerText').textContent=db.texts.footerText;}
function go(page){document.querySelectorAll('.nav nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render(page);window.scrollTo({top:0});}
document.querySelectorAll('.nav nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
const themeBtn=document.getElementById('themeBtn');
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('art-class-theme',t);themeBtn.textContent=t==='dark'?'☀️ روشن':'🌙 تاریک';}
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(localStorage.getItem('art-class-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function assignmentOptions(grade){return db.assignments.filter(a=>!grade||a.grade===grade).map(a=>`<option value="${a.id}">${esc(a.title)} — پایه ${esc(a.grade)} (${faDate(a.deadline)})</option>`).join('')}
</script>

<script>
function render(page){
  const app=document.getElementById('app'); applyTexts();
  if(page==='home'){
    const list=db.assignments.filter(a=>!a.archived);
    app.innerHTML=`<section class="hero"><div class="hero-art"></div><div class="hero-shade"></div><div class="hero-inner">
      <div class="eyebrow">درس فرهنگ و هنر</div><h1>${esc(db.texts.homeTitle)}</h1>
      <p class="lead">${esc(db.texts.homeText)}</p>
      <p><button class="btn btn-primary" onclick="go('submit')">✈️ ارسال تکلیف</button> <button class="btn btn-ghost" onclick="go('wall')">🖼️ دیوار آثار زیبا</button></p></div></section>
    <h2 style="margin-top:28px">تکلیف‌های فعال</h2>
    <p class="muted">${list.length} تکلیف</p>
    <div class="grid">${list.length?list.map(a=>`<div class="card"><b>${esc(a.title)}</b> <span class="badge">پایه ${esc(a.grade)}</span> <span class="badge">مهلت: ${faDate(a.deadline)}</span><p class="muted">${esc(a.desc||'')}</p><button class="btn btn-gold" onclick="go('submit')">ارسال این تکلیف</button></div>`).join(''):'<div class="card">هنوز تکلیفی ثبت نشده است. معلم از پنل معلم اولین تکلیف را می‌سازد.</div>'}</div>`;
  }
  if(page==='submit'){
    app.innerHTML=`<div class="card"><h2>${esc(db.texts.submitTitle)}</h2>
    <form id="subForm">
      <label>پایه</label><select id="fGrade" required><option value="">انتخاب کنید</option><option>هفتم</option><option>هشتم</option><option>نهم</option></select>
      <label>کلاس</label><select id="fClass" required><option value="">انتخاب کنید</option><option>الف</option><option>ب</option><option>ج</option></select>
      <label>نام و نام خانوادگی</label><input id="fName" required placeholder="مثلاً علی رضایی">
      <label>تکلیف</label><select id="fAssign" required>${assignmentOptions()}</select>
      <label>عکس یا فایل PDF اثر</label><input id="fFile" type="file" accept="image/*,.pdf" required>
      <p class="muted">فایل در همین مرورگر ذخیره می‌شود (نسخه نمایشی). برای نسخه اشتراکی به بخش README نگاه کنید.</p>
      <label>توضیح برای معلم (خصوصی — در دیوار آثار نمایش داده نمی‌شود)</label><textarea id="fDesc" placeholder="توضیح کوتاه برای معلم…"></textarea>
      <p><button class="btn btn-primary" type="submit">ارسال تکلیف</button></p>
    </form><div id="subResult"></div></div>`;
    document.getElementById('fGrade').onchange=e=>{document.getElementById('fAssign').innerHTML=assignmentOptions(e.target.value)||'<option value="">برای این پایه تکلیفی نیست</option>'};
    document.getElementById('subForm').onsubmit=e=>{e.preventDefault();
      const file=document.getElementById('fFile').files[0]; if(!file){alert('فایل را انتخاب کنید');return}
      const rd=new FileReader();
      rd.onload=()=>{
        const sub={id:uid(),code:uid(),grade:document.getElementById('fGrade').value,cls:document.getElementById('fClass').value,name:document.getElementById('fName').value.trim(),assignmentId:document.getElementById('fAssign').value,desc:document.getElementById('fDesc').value.trim(),fileName:file.name,fileMime:file.type,fileData:file.type.startsWith('image/')?rd.result:'',date:new Date().toISOString().slice(0,10),score:null,feedback:'',status:'بررسی نشده',featured:false,annotations:[],archived:false};
        db.submissions.push(sub); save();
        document.getElementById('subResult').innerHTML=`<div class="card" style="margin-top:16px;text-align:center"><div style="font-size:40px">✅</div><h3>تکلیفتان ارسال شد</h3><p class="muted">این کد پیگیری را نگه دارید. با آن می‌توانید وضعیت بررسی و نمره‌تان را ببینید.</p><div class="codebox" id="codeBox">${sub.code}</div><button class="btn btn-gold" type="button" onclick="copyCode('${sub.code}')">📋 کپی کد</button> <button class="btn btn-ghost" type="button" onclick="go('track')">پیگیری همین تکلیف</button></div>`;
        document.getElementById('subForm').reset();
      };
      // PDF: do not store large binary in localStorage in demo; keep name only
      if(file.type.startsWith('image/')){ rd.readAsDataURL(file); } else {
        const sub={id:uid(),code:uid(),grade:document.getElementById('fGrade').value,cls:document.getElementById('fClass').value,name:document.getElementById('fName').value.trim(),assignmentId:document.getElementById('fAssign').value,desc:document.getElementById('fDesc').value.trim(),fileName:file.name,fileMime:file.type,fileData:'',date:new Date().toISOString().slice(0,10),score:null,feedback:'',status:'بررسی نشده',featured:false,annotations:[],archived:false};
        db.submissions.push(sub); save();
        document.getElementById('subResult').innerHTML=`<div class="card" style="margin-top:16px;text-align:center"><div style="font-size:40px">✅</div><h3>تکلیفتان ارسال شد</h3><p class="muted">این کد پیگیری را نگه دارید.</p><div class="codebox" id="codeBox">${sub.code}</div><button class="btn btn-gold" type="button" onclick="copyCode('${sub.code}')">📋 کپی کد</button> <button class="btn btn-ghost" type="button" onclick="go('track')">پیگیری همین تکلیف</button></div>`;
        document.getElementById('subForm').reset();
      }
    };
  }
  if(page==='track'){
    app.innerHTML=`<div class="card"><h2>${esc(db.texts.trackTitle)}</h2><label>کد پیگیری</label><input id="tCode" placeholder="مثلاً EFC0790B"><p><button class="btn btn-primary" onclick="doTrack()">مشاهده وضعیت</button></p><div id="tResult"></div></div>`;
  }
  if(page==='wall'){
    const items=db.submissions.filter(s=>s.featured&&!s.archived);
    app.innerHTML=`<h2>${esc(db.texts.wallTitle)}</h2><p class="muted">${esc(db.texts.wallText)}</p>
    <div class="wall">${items.length?items.map(s=>{const a=db.assignments.find(x=>x.id===s.assignmentId);return `<figure onclick="openWall('${s.id}')">${s.fileData?`<img src="${s.fileData}" alt="">`:`<div style="height:200px;display:grid;place-items:center;background:var(--surface2)">📄 ${esc(s.fileName)}</div>`}<figcaption><b>${esc(a?a.title:'')}</b><br><span class="muted">${esc(s.name)} — پایه ${esc(s.grade)}، کلاس ${esc(s.cls)} — ${faDate(s.date)}</span><br><span class="badge gold">★ اثر منتخب</span></figcaption></figure>`}).join(''):'<div class="card">هنوز اثری در دیوار نیست.</div>'}</div>
    <p class="muted" style="margin-top:12px">در دیوار آثار، توضیح خصوصی دانش‌آموز و نمره نمایش داده نمی‌شود.</p>`;
  }
  if(page==='teacher'){ renderTeacher(app); }
}
function copyCode(code){
  const done=()=>{alert('کد کپی شد: '+code)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(()=>fallbackCopy(code))} else fallbackCopy(code);
  function fallbackCopy(c){const el=document.getElementById('codeBox'); if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');} alert('کد را با نگه‌داشتن روی آن کپی کنید: '+c)}
}
function doTrack(){
  const code=document.getElementById('tCode').value.trim().toUpperCase();
  const s=db.submissions.find(x=>x.code===code);
  const el=document.getElementById('tResult');
  if(!s){el.innerHTML='<p>تکلیفی با این کد پیدا نشد. کد را دوباره بررسی کنید.</p>';return}
  const a=db.assignments.find(x=>x.id===s.assignmentId);
  el.innerHTML=`<div class="card" style="margin-top:14px"><b>${esc(a?a.title:'')}</b> — ${esc(s.name)}، پایه ${esc(s.grade)}، کلاس ${esc(s.cls)}<br>
  وضعیت: <span class="badge">${esc(s.status)}</span> ${s.score!=null?` | نمره: <b>${s.score} از ۲۰</b>`:''}
  ${s.feedback?`<p>نظر معلم: ${esc(s.feedback)}</p>`:''}
  ${s.fileData?`<div class="annotate-wrap"><img src="${s.fileData}" alt="">${(s.annotations||[]).map((p,i)=>`<span class="pin" style="left:${p.x}%;top:${p.y}%">${i+1}</span>`).join('')}</div>`:''}
  ${(s.annotations||[]).map((p,i)=>`<div class="pin-note"><b>${i+1}.</b> ${esc(p.note)}</div>`).join('')}
  </div>`;
}
function openWall(id){
  const s=db.submissions.find(x=>x.id===id); if(!s)return;
  const a=db.assignments.find(x=>x.id===s.assignmentId);
  openModal(`<button class="btn btn-ghost" style="float:left" onclick="closeModal()">✕</button><h3>${esc(a?a.title:'')}</h3>
  ${s.fileData?`<img src="${s.fileData}" style="max-width:100%;border-radius:12px" alt="">`:`<p>📄 ${esc(s.fileName)}</p>`}
  <p><span class="badge gold">★ اثر منتخب</span></p><p>${esc(s.name)} — پایه ${esc(s.grade)}، کلاس ${esc(s.cls)} — ${faDate(s.date)}</p>`);
}
</script>

<script>
let teacherAuthed=false, teacherTab='overview';
function renderTeacher(app){
  if(!db.teacherPass){
    app.innerHTML=`<div class="card"><h2>پنل معلم</h2><p class="muted">برای اولین بار، یک رمز برای پنل معلم تعیین کنید. این رمز فقط در همین مرورگر ذخیره می‌شود (نسخه نمایشی).</p><label>رمز جدید</label><input id="pw1" type="password"><label>تکرار رمز</label><input id="pw2" type="password"><p><button class="btn btn-primary" onclick="setPass()">تعیین رمز</button></p></div>`; return;
  }
  if(!teacherAuthed){
    app.innerHTML=`<div class="card"><h2>ورود معلم</h2><label>رمز پنل معلم</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')doLogin()"><p><button class="btn btn-primary" onclick="doLogin()">ورود</button></p><p class="muted">رمز را فراموش کرده‌اید؟ در نسخه نمایشی، از تنظیمات مرورگر داده سایت (localStorage کلید ${LS}) را پاک کنید.</p></div>`; return;
  }
  const total=db.submissions.length, un=db.submissions.filter(s=>s.status==='بررسی نشده').length, graded=db.submissions.filter(s=>s.score!=null).length;
  let html=`<h2>پنل معلم</h2><div class="stats">
    <div class="stat"><b>${total}</b>کل ارسال‌ها</div><div class="stat"><b>${un}</b>بررسی‌نشده</div>
    <div class="stat"><b>${graded}</b>نمره‌داده‌شده</div><div class="stat"><b>${db.assignments.filter(a=>!a.archived).length}</b>تکلیف فعال</div></div>
  <div class="tabs">
    <button class="${teacherTab==='overview'?'active':''}" onclick="teacherTab='overview';render('teacher')">ارسال‌ها</button>
    <button class="${teacherTab==='assign'?'active':''}" onclick="teacherTab='assign';render('teacher')">تکلیف‌ها</button>
    <button class="${teacherTab==='texts'?'active':''}" onclick="teacherTab='texts';render('teacher')">متن‌های سایت</button>
  </div><div id="tabBody"></div>`;
  app.innerHTML=html;
  const body=document.getElementById('tabBody');
  if(teacherTab==='assign'){
    body.innerHTML=`<div class="card"><h3>ساخت تکلیف جدید</h3>
      <label>عنوان</label><input id="aTitle" placeholder="مثلاً طرحی از طبیعت">
      <label>پایه</label><select id="aGrade"><option>هفتم</option><option>هشتم</option><option>نهم</option></select>
      <label>مهلت (تاریخ شمسی نمایش داده می‌شود)</label><input id="aDead" type="date">
      <label>توضیح</label><textarea id="aDesc"></textarea>
      <p><button class="btn btn-primary" onclick="addAssign()">ساخت تکلیف</button></p></div>
      <div class="grid" style="margin-top:14px">${db.assignments.map(a=>`<div class="card"><b>${esc(a.title)}</b> — پایه ${esc(a.grade)} — مهلت ${faDate(a.deadline)}<br><button class="btn-danger" onclick="delAssign('${a.id}')">حذف / آرشیو</button></div>`).join('')||'تکلیفی نیست.'}</div>`;
  } else if(teacherTab==='texts'){
    const t=db.texts;
    body.innerHTML=`<div class="card"><h3>متن‌های سایت</h3><p class="muted">همه متن‌های سایت را اینجا ویرایش کنید؛ بلافاصله در سایت اعمال می‌شود.</p>
    ${Object.keys(t).map(k=>`<label>${k}</label><input data-text="${k}" value="${esc(t[k])}">`).join('')}
    <p><button class="btn btn-primary" onclick="saveTexts()">ذخیره متن‌ها</button> <button class="btn btn-ghost" onclick="resetTexts()">بازگردانی پیش‌فرض</button></p></div>`;
  } else {
    body.innerHTML=`<div class="card"><div class="grid grid2">
      <div><label>جستجو (نام دانش‌آموز)</label><input id="q" oninput="renderTeacherList()" placeholder="نام…"></div>
      <div><label>پایه</label><select id="fG" onchange="renderTeacherList()"><option value="">همه</option><option>هفتم</option><option>هشتم</option><option>نهم</option></select></div>
      <div><label>کلاس</label><select id="fC" onchange="renderTeacherList()"><option value="">همه</option><option>الف</option><option>ب</option><option>ج</option></select></div>
      <div><label>وضعیت</label><select id="fS" onchange="renderTeacherList()"><option value="">همه</option><option>بررسی نشده</option><option>بررسی شده</option><option>نمره داده شده</option></select></div>
    </div><div id="subList" style="margin-top:14px"></div></div>`;
    renderTeacherList();
  }
}
function renderTeacherList(){
  const el=document.getElementById('subList'); if(!el)return;
  const q=(document.getElementById('q')?.value||'').trim(), g=document.getElementById('fG')?.value||'', c=document.getElementById('fC')?.value||'', st=document.getElementById('fS')?.value||'';
  const list=db.submissions.filter(s=>!s.archived && (!q||s.name.includes(q)) && (!g||s.grade===g) && (!c||s.cls===c) && (!st||s.status===st));
  el.innerHTML=list.length?`<table><tr><th>دانش‌آموز</th><th>پایه / کلاس</th><th>تکلیف</th><th>وضعیت / نمره</th><th></th></tr>${list.map(s=>{const a=db.assignments.find(x=>x.id===s.assignmentId);return `<tr><td>${esc(s.name)}<br><span class="muted">${s.code} — ${faDate(s.date)}</span></td><td>${esc(s.grade)} / ${esc(s.cls)}</td><td>${esc(a?a.title:'')}</td><td>${esc(s.status)}${s.score!=null?` — ${s.score}/۲۰`:''}</td><td><button class="btn btn-ghost" onclick="openSubmission('${s.id}')">باز کردن</button></td></tr>`}).join('')}</table>`:'<p class="muted">ارسالی با این فیلتر پیدا نشد.</p>';
}
function setPass(){const a=document.getElementById('pw1').value,b=document.getElementById('pw2').value;if(!a||a!==b){alert('رمزها یکی نیستند یا خالی‌اند');return}db.teacherPass=a;save();teacherAuthed=true;render('teacher')}
function doLogin(){if(document.getElementById('pw').value===db.teacherPass){teacherAuthed=true;render('teacher')}else alert('رمز اشتباه است')}
function addAssign(){const t=document.getElementById('aTitle').value.trim();if(!t){alert('عنوان را بنویسید');return}db.assignments.push({id:uid(),title:t,grade:document.getElementById('aGrade').value,deadline:document.getElementById('aDead').value,desc:document.getElementById('aDesc').value,archived:false});save();render('teacher')}
function delAssign(id){if(!confirm('این تکلیف آرشیو شود؟'))return;const a=db.assignments.find(x=>x.id===id);if(a)a.archived=true;save();render('teacher')}
function saveTexts(){document.querySelectorAll('[data-text]').forEach(i=>db.texts[i.dataset.text]=i.value);save();applyTexts();alert('متن‌ها ذخیره شد')}
function resetTexts(){if(!confirm('همه متن‌ها به پیش‌فرض برگردد؟'))return;db.texts={...defaultTexts};save();render('teacher')}
function openSubmission(id){
  const s=db.submissions.find(x=>x.id===id); if(!s)return;
  const a=db.assignments.find(x=>x.id===s.assignmentId);
  openModal(`<button class="btn btn-ghost" style="float:left" onclick="closeModal()">✕</button>
  <h3>${esc(a?a.title:'')} — ${esc(s.name)}</h3><p class="muted">پایه ${esc(s.grade)}، کلاس ${esc(s.cls)} — کد ${s.code} — ${faDate(s.date)}</p>
  <p><b>توضیح خصوصی دانش‌آموز (فقط معلم می‌بیند):</b> ${esc(s.desc||'—')}</p>
  ${s.fileData?`<p class="muted">برای نشانه‌گذاری، روی عکس بزنید. هر نشانه یک عدد می‌گیرد و می‌توانید برایش یادداشت بنویسید.</p><div class="annotate-wrap" id="annWrap"><img id="annImg" src="${s.fileData}" alt=""><span id="pins"></span></div><div id="pinList"></div>`:`<p>📄 فایل: ${esc(s.fileName)} (در نسخه نمایشی، PDF فقط نامش ذخیره می‌شود)</p>`}
  <label>نمره (۰ تا ۲۰)</label><input id="mScore" type="number" min="0" max="20" step="0.5" value="${s.score??''}">
  <label>بازخورد برای دانش‌آموز</label><textarea id="mFeed">${esc(s.feedback||'')}</textarea>
  <label>وضعیت</label><select id="mStatus"><option ${s.status==='بررسی نشده'?'selected':''}>بررسی نشده</option><option ${s.status==='بررسی شده'?'selected':''}>بررسی شده</option><option ${s.status==='نمره داده شده'?'selected':''}>نمره داده شده</option></select>
  <p><label><input type="checkbox" id="mFeat" ${s.featured?'checked':''} style="width:auto"> نمایش در دیوار آثار زیبا (بدون توضیح خصوصی و بدون نمره)</label></p>
  <p><button class="btn btn-primary" onclick="saveSubmission('${s.id}')">ذخیره نمره و بازخورد</button> <button class="btn-danger" onclick="archiveSub('${s.id}')">آرشیو / حذف</button></p>`);
  renderPins(s);
  const img=document.getElementById('annImg');
  if(img){img.onclick=e=>{const r=img.getBoundingClientRect();const x=+(((e.clientX-r.left)/r.width)*100).toFixed(1), y=+(((e.clientY-r.top)/r.height)*100).toFixed(1);const note=prompt('یادداشت برای این قسمت (مثلاً ایراد همین قسمت):');if(note==null)return;s.annotations.push({x,y,note});save();renderPins(s);};}
}
function renderPins(s){
  const pins=document.getElementById('pins'), list=document.getElementById('pinList'); if(!pins)return;
  pins.innerHTML=(s.annotations||[]).map((p,i)=>`<span class="pin" style="left:${p.x}%;top:${p.y}%">${i+1}</span>`).join('');
  if(list) list.innerHTML=(s.annotations||[]).map((p,i)=>`<div class="pin-note"><b>${i+1}.</b> ${esc(p.note)} <button class="btn-danger" onclick="delPin('${s.id}',${i})">حذف نشانه</button></div>`).join('');
}
function delPin(id,i){const s=db.submissions.find(x=>x.id===id);s.annotations.splice(i,1);save();openSubmission(id);render('teacher');}
function saveSubmission(id){const s=db.submissions.find(x=>x.id===id);const sc=document.getElementById('mScore').value;s.score=sc===''?null:+sc;s.feedback=document.getElementById('mFeed').value;s.status=document.getElementById('mStatus').value;s.featured=document.getElementById('mFeat').checked;if(s.score!=null)s.status='نمره داده شده';save();closeModal();render('teacher');alert('ذخیره شد')}
function archiveSub(id){if(!confirm('این ارسال آرشیو شود؟'))return;const s=db.submissions.find(x=>x.id===id);s.archived=true;save();closeModal();render('teacher')}
load(); render('home');
</script>
</body>
</html>
